name: "舊電腦遊戲相容性求助 / Legacy PC game compatibility"
description: "回報 CPU、遊戲版本及卡住階段，請勿張貼個資與授權金鑰。"
title: "[遊戲相容性] "
body:
  - type: markdown
    attributes:
      value: |
        這是社群技術交流，不保證可修復；僅協助正版遊戲問題。
        **禁止公開** 帳號、密碼、PSN/Steam ID、產品序號、IP、金鑰、未遮蔽的日誌或 crash dump。
  - type: input
    id: game
    attributes:
      label: "遊戲名稱與平台 / Game + platform"
      placeholder: "Ghost of Tsushima DIRECTOR'S CUT / Steam"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "遊戲版本 / Version"
      placeholder: "v1053.x"
    validations:
      required: true
  - type: input
    id: cpu
    attributes:
      label: "CPU 型號"
      placeholder: "Xeon E3-1240 v1"
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: "GPU、RAM、Windows 版本"
      placeholder: "GTX 1060 5GB / 8GB DDR3 / Windows 10 Pro 64-bit"
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: "卡在哪個階段？ / Blocked stage"
      options:
        - "無法啟動 / Game launch"
        - "登入 PSN / PlayStation login"
        - "進入奇譚選單 / Legends menu"
        - "多人配對 / Matchmaking"
        - "遊戲中閃退或卡頓 / Crash or slow FPS"
        - "其他 / Other"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "錯誤碼、實際狀況、已嘗試方法 / Error and attempted fixes"
      description: "勿貼任何敏感資料。"
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: "確認 / Confirmation"
      options:
        - label: "我使用正版遊戲，已遮蔽所有個人及登入資料。"
          required: true
