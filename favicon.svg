<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="swGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Hexagon -->
  <rect width="64" height="64" rx="16" fill="#090d16"/>
  <!-- Glowing Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#swGrad)" stroke-width="2" stroke-opacity="0.8"/>
  
  <!-- Central Agent Core Nodes & Paths -->
  <g transform="translate(32, 32)" filter="url(#glow)">
    <!-- Core central node -->
    <circle cx="0" cy="0" r="4.5" fill="#00e5ff"/>
    
    <!-- Outer agent satellites -->
    <circle cx="-14" cy="-12" r="3" fill="#38bdf8"/>
    <circle cx="14" cy="-12" r="3" fill="#818cf8"/>
    <circle cx="16" cy="10" r="3" fill="#c084fc"/>
    <circle cx="-16" cy="10" r="3" fill="#2dd4bf"/>
    <circle cx="0" cy="18" r="3" fill="#60a5fa"/>

    <!-- Synapse connections -->
    <path d="M-14 -12 L0 0 L14 -12 M-16 10 L0 0 L16 10 M0 0 L0 18 M-14 -12 L-16 10 M14 -12 L16 10" 
          stroke="url(#swGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
          
    <!-- Stylized SW Core Wave -->
    <path d="M-10 -4 C-6 -8, 6 -8, 10 -4 C6 0, -6 0, -10 4 C-6 8, 6 8, 10 4" 
          stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
